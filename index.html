<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Rupa 🎉</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #ffb6c1; /* Pink */
        font-family: 'Poppins', sans-serif;
        text-align: center;
        overflow-x: hidden;
    }

    h1 {
        font-size: 40px;
        margin-top: 40px;
        color: #fff;
        text-shadow: 2px 2px 10px #d63384;
    }

    .rose {
        width: 220px;
        margin-top: 20px;
        animation: float 3s infinite ease-in-out;
    }

    @keyframes float {
        0% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
        100% { transform: translateY(0); }
    }

    .gift-box {
        width: 200px;
        margin: 35px auto;
        cursor: pointer;
        transition: 0.6s;
    }

    .message {
        font-size: 22px;
        color: #fff;
        padding: 0 20px;
        display: none;
        margin-top: 20px;
        animation: fadein 1s forwards;
    }

    @keyframes fadein {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .confetti {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
    }
</style>
</head>

<body>

<h1>🎉 Happy Birthday Rupa 🎀</h1>

<img class="rose" src="https://i.imgur.com/6DPpYQ9.png" alt="rose">

<div>
    <img id="gift" class="gift-box" src="https://i.imgur.com/zYxr5QJ.png" alt="gift">
</div>

<div id="msg" class="message">
    Wishing you a day filled with love, joy, and happiness.  
    May all your dreams come true. 💖  
    <br><br>Enjoy your special day, Rupa! 🎉
</div>

<canvas class="confetti" id="confetti"></canvas>

<audio id="music" loop>
    <source src="https://cdn.pixabay.com/audio/2023/04/13/audio_7e28b85b44.mp3">
</audio>

<script>
    const gift = document.getElementById("gift");
    const msg = document.getElementById("msg");
    const music = document.getElementById("music");

    gift.onclick = () => {
        gift.style.transform = "scale(0)";
        setTimeout(() => gift.style.display = "none", 600);
        msg.style.display = "block";
        music.play();
        startConfetti();
    };

    function startConfetti() {
        const canvas = document.getElementById("confetti");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let confetti = [];
        for (let i = 0; i < 150; i++) {
            confetti.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                r: 4 + Math.random() * 6,
                d: Math.random() * 1,
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            confetti.forEach((c) => {
                ctx.beginPath();
                ctx.fillStyle = "hsl(" + Math.random() * 360 + ", 100%, 50%)";
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.fill();
            });

            update();
        }

        function update() {
            confetti.forEach((c) => {
                c.y += c.d + 2;
                if (c.y > canvas.height) {
                    c.y = 0 - c.r;
                }
            });
        }

        setInterval(draw, 20);
    }
</script>

</body>
</html>
